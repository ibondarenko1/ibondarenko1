name: Update README

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test CVE discovery
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Discover published CVE finder credits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/discover_cves.py

      - name: Regenerate dynamic README sections
        run: python3 scripts/update_readme.py

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain README.md data/profile_badges.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md data/profile_badges.json
            git commit -m "chore: refresh README CVE and contribution badges"
            git push
          else
            echo "README already current."
          fi
